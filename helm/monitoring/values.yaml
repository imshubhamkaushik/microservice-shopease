# kube-prometheus-stack values
# Aligned with previous manual Prometheus/Grafana setup

# Prometheus
prometheus:
  enabled: true

  prometheusSpec:
    retention: 10d

    # Allow Prometheus to discover ServiceMonitors created by the chart
    serviceMonitorSelectorNilUsesHelmValues: false

    # Allow Prometheus to discover PodMonitors created by the chart
    podMonitorSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Alertmanager
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "default"
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
    receivers:
      - name: "default"

# Grafana
grafana:
  enabled: true

  # This is explicitly for demo. Never do this in real prod
  # adminUser: admin
  # adminPassword: admin

  admin:
    existingSecret: ""

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Custom Alert Rules (Equivalent to prometheus-alerts.yaml)
additionalPrometheusRules:
  - name: shopease-alerts
    groups:
      - name: service-availability
        rules:
          - alert: ServiceDown
            expr: |
              sum by (namespace, service) (
                up{job="kubernetes-service-endpoints"}
              ) == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.service }} is DOWN"
              description: "Service {{ $labels.service }} is not responding."

      - name: cpu-alerts
        rules:
          - alert: HighCPUUsage
            expr: |
              sum by (pod, namespace)(
                rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m])
              )
              /
              sum by (pod, namespace)(
                kube_pod_container_resource_limits_cpu_cores
              )
              > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.service }} detected"
              description: "CPU usage above 80% for 5 minutes."

      - name: jvm-memory-alerts
        rules:
          - alert: HighJVMMemoryUsage
            expr: |
              (
                jvm_memory_used_bytes{area="heap"}
                /
                jvm_memory_max_bytes{area="heap"}
              ) > 0.80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High JVM heap usage on {{ $labels.service }}"
              description: "Heap usage exceeded 80%."
