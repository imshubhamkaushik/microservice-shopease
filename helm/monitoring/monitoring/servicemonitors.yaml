  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: product-service
  namespaceSelector:
    matchNames:
      - shopease
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
